<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Space &amp; Style — Quote Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f1f4d;
  --ink-2:#34446f;
  --muted:#6a7595;
  --line:#dde2ee;
  --line-2:#c6cee2;
  --bg:#edf0f6;
  --card:#ffffff;
  --blue:#1f4fbf;
  --blue-soft:#e6edfc;
  --orange:#f29a1f;
  --orange-d:#d9820a;
  --danger:#b3261e;
  --ok:#17784a;
  --font:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);font-size:14px;line-height:1.4;color:var(--ink);background:var(--bg);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink)}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:60;background:var(--ink);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 18px;border-bottom:3px solid var(--orange)}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.logo-chip{background:#fff;border-radius:6px;padding:3px 8px;display:flex;align-items:center}
.logo-chip img{height:28px;display:block}
.brand-t{font-weight:700;font-size:15px;letter-spacing:.2px}
.projbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:6px;padding:6px 12px;display:flex;align-items:center;gap:8px;max-width:340px;min-width:0}
.projbtn #projName{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.projbtn:hover{background:rgba(255,255,255,.16)}
.tb-actions{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tb-btn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:6px 11px;font-weight:600;font-size:13px}
.tb-btn:hover:not(:disabled){background:rgba(255,255,255,.14)}
.tb-btn:disabled{opacity:.4;cursor:default}
.tb-btn.primary{background:var(--orange);border-color:var(--orange);color:#1c1200}
.tb-btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}

/* ---------- tabs ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--line);padding:0 18px;display:flex;gap:26px;position:sticky;top:53px;z-index:50}
.tab{padding:12px 2px 10px;font-weight:700;color:var(--muted);border:0;background:none;border-bottom:3px solid transparent;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.active{color:var(--ink);border-bottom-color:var(--orange)}

/* ---------- layout ---------- */
.wrap{max-width:1640px;margin:0 auto;padding:18px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.side{position:sticky;top:112px}
@media (max-width:1040px){.split{grid-template-columns:minmax(0,1fr)}.side{position:static}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:14px}
.card>h2{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:.1px}
.card>.sub{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.hint{color:var(--muted);font-size:12.5px;margin:8px 0 0}
.grid{display:grid;gap:10px 14px}
.g1{grid-template-columns:minmax(0,1fr)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
@media (max-width:760px){.g3,.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fld>span:empty{display:none}
.fld.span2{grid-column:span 2}
.fld.span3{grid-column:span 3}
.fld.chk{flex-direction:row;align-items:center;gap:8px;font-size:13px;color:var(--ink);font-weight:500;padding-top:18px}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--line-2);border-radius:6px;padding:7px 9px;background:#fff;min-width:0;font-weight:500}
textarea.autosize{resize:none;overflow:hidden;line-height:1.2;padding:6px 7px;display:block}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--blue)}
textarea{resize:vertical;line-height:1.4}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue-soft);border-color:var(--blue)}
input[readonly]{background:#f4f6fb;color:var(--ink-2)}
input.r{text-align:right}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:#fff;color:var(--ink);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px}
.btn:hover{background:var(--blue-soft);border-color:var(--blue)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1c1200}
.btn.primary:hover{background:var(--orange-d);border-color:var(--orange-d)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.solid:hover{background:var(--ink-2)}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:#fdeceb;border-color:var(--danger)}
.btn.sm{padding:4px 9px;font-size:12px}
.ib{border:1px solid var(--line-2);background:#fff;color:var(--ink-2);border-radius:5px;min-width:26px;height:26px;padding:0 6px;font-size:12px;font-weight:700}
.ib:hover:not(:disabled){background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.ib:disabled{opacity:.35;cursor:default}
.ib.on{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
.ib.del:hover:not(:disabled){background:#fdeceb;border-color:var(--danger);color:var(--danger)}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}

/* ---------- quote chips ---------- */
.qbar{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.qchip{border:1px solid var(--line-2);border-top:3px solid var(--line-2);background:#f8f9fc;border-radius:8px 8px 0 0;padding:7px 14px 8px;min-width:170px;text-align:left;display:flex;flex-direction:column;gap:1px}
.qchip:hover{background:#fff}
.qchip.on{background:#fff;border-top-color:var(--orange);border-color:var(--line-2);border-top-color:var(--orange);box-shadow:0 1px 0 #fff}
.qchip .t{font-weight:800;font-size:13.5px}
.qchip .s{font-size:11.5px;color:var(--muted)}
.qchip .n{font-size:13px;font-weight:700;color:var(--ink-2)}
.qbar .spacer{flex:1}

/* ---------- lines table ---------- */
.tablewrap{overflow-x:auto}
table.lines{width:100%;border-collapse:collapse;min-width:900px}
table.lines th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:6px 5px;border-bottom:2px solid var(--line-2);white-space:nowrap}
table.lines th.r{text-align:right}
table.lines td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:top}
table.lines td.idx{width:26px;color:var(--muted);text-align:center;padding-top:11px;font-size:12px}
table.lines td.r{text-align:right}
table.lines input{padding:6px 7px}
.calc{display:block;padding:7px 6px;text-align:right;font-weight:700;white-space:nowrap}
.calc.soft{font-weight:500;color:var(--ink-2)}
.acts{white-space:nowrap;padding-top:5px!important}
.acts .ib{margin-right:2px}
tr.dt td{background:#fafbfe;border-bottom:1px solid var(--line)}
tr.dt textarea{font-size:13px;color:#1f3fbf}
.tag{display:inline-block;background:var(--blue-soft);color:var(--blue);font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;margin-left:4px}
.tag.orange{background:#fff1dc;color:#9a5a00}

.addbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.libsearch{position:relative;flex:1;min-width:280px}
.libres{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--line-2);border-radius:8px;box-shadow:0 12px 30px rgba(15,31,77,.18);max-height:340px;overflow:auto}
.libres .it{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--line);align-items:baseline}
.libres .it:last-child{border-bottom:0}
.libres .it.on,.libres .it:hover{background:var(--blue-soft)}
.libres .c{font-weight:800}
.libres .d{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.libres .p{color:var(--muted);font-size:12.5px}
.libres .none{padding:10px 12px;color:var(--muted)}

/* ---------- ledger (sticky totals) ---------- */
.ledger .row{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;border-bottom:1px dashed var(--line-2);gap:8px}
.ledger .row span{color:var(--ink-2)}
.ledger .row b{font-weight:800}
.ledger .big{border-bottom:0;padding-top:12px;flex-direction:column;align-items:stretch;gap:0}
.ledger .big span{font-weight:700}
.ledger .big b{font-size:27px;letter-spacing:-.6px;color:var(--ink);text-align:right}
.ledger .btn{width:100%;margin-top:10px}
.ledger .mini{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- grand summary ---------- */
table.gtab{width:100%;border-collapse:collapse;min-width:820px}
table.gtab th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:6px 5px;border-bottom:2px solid var(--line-2)}
table.gtab td{padding:4px 3px;border-bottom:1px solid var(--line);vertical-align:top}
table.gtab td.idx{width:26px;color:var(--muted);text-align:center;padding-top:11px;font-size:12px}
table.gtab tr.sect td{background:#f3f5fb;font-weight:800;padding:7px 8px;color:var(--ink-2);border-bottom:1px solid var(--line-2)}
.diff{display:block;text-align:right;font-size:11.5px;color:#9a5a00;font-weight:600;min-height:14px}
.diff:empty{display:none}

/* ---------- library ---------- */
.subtabs{display:flex;gap:6px;margin-bottom:12px}
.subtab{border:1px solid var(--line-2);background:#fff;border-radius:6px;padding:6px 14px;font-weight:700;font-size:13px;color:var(--ink-2)}
.subtab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.lib-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lib-tools input[type=text]{width:340px}
.lib-tools select{width:200px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line-2);background:#fff;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
table.lib{width:100%;border-collapse:collapse;min-width:880px}
table.lib th{font-size:12px;color:var(--muted);font-weight:700;text-align:left;padding:6px 5px;border-bottom:2px solid var(--line-2);white-space:nowrap}
table.lib th.r{text-align:right}
table.lib td{padding:3px;border-bottom:1px solid var(--line);vertical-align:middle}
table.lib td.plain{padding:6px 8px}
table.lib td.r{text-align:right}
table.lib input{padding:6px 7px}
.empty{padding:26px;text-align:center;color:var(--muted)}

/* ---------- modal + toast ---------- */
.modal-ov{position:fixed;inset:0;background:rgba(15,31,77,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
.modal{background:#fff;border-radius:10px;width:min(640px,100%);box-shadow:0 24px 60px rgba(15,31,77,.35);padding:18px 20px 16px;max-height:88vh;overflow:auto}
.modal.wide{width:min(820px,100%)}
.modal h3{margin:0 0 4px;font-size:17px}
.modal .sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.modal-foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap;position:sticky;bottom:-16px;background:#fff;padding:12px 0 2px;border-top:1px solid var(--line)}
.modal .fld.chk{padding-top:4px}
.readout{background:var(--blue-soft);border-radius:8px;padding:10px 12px;margin-top:12px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.readout div{display:flex;flex-direction:column;font-size:12px;color:var(--muted);font-weight:600}
.readout b{font-size:16px;color:var(--ink)}
.plist{border:1px solid var(--line);border-radius:8px;max-height:46vh;overflow:auto}
.plist .pr{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.plist .pr:last-child{border-bottom:0}
.plist .pr.cur{background:var(--blue-soft)}
.plist .pn{flex:1;min-width:0}
.plist .pn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plist .pn small{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:400;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.help{background:#fff8ea;border:1px solid #f3d9a4;border-radius:8px;padding:9px 12px;font-size:13px;color:#6b4a06;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

/* =========================================================
   Printed documents: Sage-style quotation + Grand summary
   ========================================================= */
#printRoot{position:absolute;left:-99999px;top:0;width:210mm;visibility:hidden}
#previewBar{display:none}

/* ---------- on-screen preview ---------- */
body.preview{background:#4b525e}
body.preview #appShell{display:none}
body.preview #printRoot{position:static;left:auto;width:auto;visibility:visible;display:block;padding:74px 0 40px}
body.preview #previewBar{display:flex;align-items:center;gap:12px;position:fixed;top:0;left:0;right:0;z-index:150;background:var(--ink);color:#fff;padding:10px 18px;border-bottom:3px solid var(--orange);flex-wrap:wrap}
body.preview #previewBar .pv-t{font-weight:700}
body.preview #previewBar select{width:auto;background:#fff}
body.preview #previewBar .grow{flex:1}
body.preview .doc{margin:0 auto 18px;box-shadow:0 6px 26px rgba(0,0,0,.45)}

/* ---------- shared ---------- */
.doc{background:#fff;color:#000;position:relative}
.doc *{box-sizing:border-box}

/* ---------- Sage-style quotation ---------- */
.qpage{width:210mm;min-height:296mm;padding:8mm 10mm 7mm;display:flex;flex-direction:column;font-family:Arial,Helvetica,sans-serif;font-size:9pt;line-height:1.25;break-after:page;page-break-after:always}
.q-titlebar{position:relative;height:11mm;text-align:center}
.q-titlebar h1{margin:0;font-size:20pt;line-height:11mm;font-weight:700;color:#0b0b8c;letter-spacing:.2px}
.q-stamp{position:absolute;right:0;top:3.2mm;font-size:8pt}
.q-row{display:grid;grid-template-columns:1.16fr 1fr;gap:3mm;margin-bottom:2mm}
.q-box{border:.35mm solid #1c1c1c;border-radius:4.5mm;padding:2.4mm 3.2mm;overflow:hidden}
.q-row.top .q-box{height:33mm}
.q-row.mid .q-box{height:28mm}
.q-co{font-size:9.5pt;line-height:1.28}
.q-co b{font-weight:700}
.q-co .lbl{font-weight:700}
.q-co a,.q-co u{color:#1a3fbf;text-decoration:underline}
.q-logo{display:flex;align-items:center;justify-content:center}
.q-logo img{max-width:88%;max-height:27mm;display:block}
.q-cust{display:flex;flex-direction:column;height:100%;font-size:9.5pt}
.q-cust .cc{font-weight:700;font-size:8.5pt}
.q-cust .cn{font-weight:700;font-size:10.5pt}
.q-cust .cp{font-weight:700}
.q-cust .pin{margin-top:auto}
.q-info{display:grid;grid-template-columns:auto 1fr;align-content:space-between;height:100%;row-gap:1mm;font-size:10pt;padding:0 1mm}
.q-info .v{text-align:right}
.q-body{flex:1;margin-top:2.5mm}
table.q-table{width:100%;border-collapse:collapse;table-layout:fixed}
.q-table th{font-size:8.5pt;font-weight:700;text-align:left;padding:0 1.5mm 1.6mm;vertical-align:bottom}
.q-table th.r,.q-table td.r{text-align:right}
.q-table td{font-size:9pt;padding:.9mm 1.5mm;vertical-align:top;word-wrap:break-word}
.q-table tr.dl td{padding-top:0;padding-bottom:0;color:#1f3fbf;font-size:8.6pt;white-space:pre-wrap}
.q-foot{margin-top:auto}
.q-signtot{display:grid;grid-template-columns:1.1fr 1fr;gap:6mm;margin-top:3mm}
.q-sign{font-size:8.5pt}
.q-sign .lbl{font-weight:700}
.q-prep{display:flex;align-items:baseline;gap:8mm;margin-bottom:6mm}
.q-prep .nm{font-size:12pt;font-weight:700}
.q-sigline{display:flex;align-items:flex-end;gap:2mm;margin-bottom:5mm}
.q-sigline .ln{width:38mm;border-bottom:.3mm solid #000;height:4mm}
.q-tot{padding-top:4mm}
.q-tot .r{display:grid;grid-template-columns:1fr auto;align-items:baseline;margin-bottom:6.2mm;font-size:9.5pt}
.q-tot .r b{font-weight:700}
.q-tot .r .strong{font-size:11pt;font-weight:700}
.q-terms{margin-top:3mm}
.q-terms b{font-size:8.5pt}
.q-terms ul{margin:1.5mm 0 0;padding:0;list-style:none}
.q-terms li{font-size:7.6pt;margin-bottom:1.4mm;padding-left:2.4mm;position:relative}
.q-terms li:before{content:"\2022";position:absolute;left:0}
.q-brands{margin-top:3mm;border:.35mm solid #1c1c1c;border-radius:4.5mm;height:30mm;display:flex;align-items:center;justify-content:space-around;padding:0 6mm}
.q-brands img{display:block;object-fit:contain}
.q-brands .asili{height:15mm}
.q-brands .frametech{height:13mm}
.q-brands .floor{height:11mm}
.q-brands .roofcolor{height:6.5mm}

/* ---------- Grand summary ---------- */
.gpage{width:210mm;min-height:296mm;padding:10mm 11mm;font-family:"Times New Roman",Times,serif;font-size:10pt;line-height:1.18;break-after:page;page-break-after:always}
table.gs{width:100%;border-collapse:collapse;table-layout:fixed;border:.5mm solid #000}
.gs td{border:.25mm solid #000;padding:.5mm 1.5mm;vertical-align:top;word-wrap:break-word}
.gs td.c{text-align:center}
.gs td.amt{text-align:right;white-space:nowrap}
.gs td.pl{padding:0;border-top:0;border-bottom:0}
.gs .b{font-weight:700}
.gs .pre{white-space:pre-line}
.gs .logo{padding:1.2mm 2.2mm}
.gs .logo img{height:9mm;display:block}
.gs .spacer td{height:3.6mm}
.gs td.rt{text-align:right}
.gs ul{margin:.6mm 0 1mm;padding:0;list-style:none}
.gs li{padding-left:4mm;position:relative;margin-bottom:.4mm}
.gs li:before{content:"\25AA";position:absolute;left:1mm}
.gs .terms{padding-bottom:3mm}

@media print{
  html,body{background:#fff!important}
  #appShell,#previewBar,#toast,#modalRoot{display:none!important}
  #printRoot{position:static!important;left:auto!important;width:auto!important;visibility:visible!important;display:block!important;padding:0!important}
  .doc{box-shadow:none!important;margin:0!important}
  .lastpage{break-after:auto!important;page-break-after:auto!important}
  .qpage,.gpage{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:0}
}

</style>
</head>
<body>
<div id="appShell">
  <header class="topbar">
    <div class="brand"><span class="logo-chip"><img id="brandLogo" alt="Space &amp; Style"></span><span class="brand-t">Quote Studio</span></div>
    <button class="projbtn" data-action="projects" title="Switch or manage projects"><span id="projName">Project</span><span>▾</span></button>
    <div class="tb-actions">
      <button class="tb-btn" id="btnUndo" data-action="undo" title="Undo (Ctrl+Z)" disabled>↶ Undo</button>
      <button class="tb-btn" id="btnRedo" data-action="redo" title="Redo (Ctrl+Y)" disabled>↷ Redo</button>
      <button class="tb-btn" data-action="new-project">New project</button>
      <button class="tb-btn" data-action="export-json" title="Download this project as a file to share or back up">Export</button>
      <button class="tb-btn" data-action="import-json" title="Open a project file exported from this tool">Import</button>
      <button class="tb-btn" data-action="settings">Settings</button>
      <button class="tb-btn primary" data-action="preview">Preview &amp; print</button>
    </div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="panel"></main>
</div>
<div id="previewBar"></div>
<div id="printRoot"></div>
<div id="modalRoot"></div>

function mergeSettings(stored){
  const s = clone(DEFAULT_SETTINGS);
  if(!stored || typeof stored !== 'object') return s;
  Object.keys(stored).forEach(k => {
    if(k === 'company' && stored.company && typeof stored.company === 'object') s.company = Object.assign(s.company, stored.company);
    else if(k === 'cloud' && stored.cloud && typeof stored.cloud === 'object') s.cloud = Object.assign(s.cloud, stored.cloud);
    else s[k] = stored[k];
  });
  if(!Array.isArray(s.company.lines)) s.company.lines = clone(DEFAULT_SETTINGS.company.lines);
  if(!Array.isArray(s.quoteTerms)) s.quoteTerms = clone(QUOTE_TERMS_DEFAULT);
  if(!Array.isArray(s.grandTerms)) s.grandTerms = clone(GRAND_TERMS_DEFAULT);
  return s;
}

function normalizeProject(p){
  const b = blankProject();
  p.client = Object.assign({ code:'', name:'', location:'', phone:'', pin:'' }, p.client || {});
  ['projectName','projectLocation','rep'].forEach(k => { if(p[k] == null) p[k] = b[k]; });
  if(!Array.isArray(p.quotes) || !p.quotes.length){ p.quotes = [newQuote(p)]; }
  p.quotes.forEach(q => {
    const d = newQuote({ quotes:[] });
    ['id','title','no','date','validity','vatPct','rowsPerPage','showDisc'].forEach(k => { if(q[k] == null) q[k] = d[k]; });
    if(!Array.isArray(q.lines)) q.lines = [];
    q.lines = q.lines.map(l => Object.assign(newLine(), l));
  });
  p.grand = Object.assign(clone(b.grand), p.grand || {});
  if(!Array.isArray(p.grand.items)) p.grand.items = [];
  if(!Array.isArray(p.grand.terms)) p.grand.terms = clone(settings.grandTerms);
  p.grand.items = p.grand.items.map(it => Object.assign(newGItem('main', ''), it));
  if(!p.id) p.id = uuid();
  if(!p.created) p.created = Date.now();
  if(!p.quotes.find(q => q.id === p.activeQuote)) p.activeQuote = p.quotes[0].id;
  return p;
}

/* ---------- history (undo / redo) ---------- */
const hist = { undo:[], redo:[], last:'', lastAt:0 };
function histInit(){ hist.undo = []; hist.redo = []; hist.last = JSON.stringify(project); hist.lastAt = 0; updateHistBtns(); }
function histRecord(structural){
  const now = JSON.stringify(project);
  if(now === hist.last) return;
  const t = Date.now();
  /* a burst of typing is one undo step; adding/removing/moving things is always its own step */
  if(structural || t - hist.lastAt > 700){ hist.undo.push(hist.last); if(hist.undo.length > 80) hist.undo.shift(); }
  hist.lastAt = structural ? 0 : t; hist.redo = []; hist.last = now;
  updateHistBtns();
}
function applySnapshot(s){
  project = JSON.parse(s);
  hist.last = s; hist.lastAt = 0;
  if(!project.quotes.find(q => q.id === project.activeQuote)) project.activeQuote = project.quotes[0].id;
  saveNow(); render(); updateHistBtns();
}
function undo(){ if(!hist.undo.length) return; hist.redo.push(JSON.stringify(project)); applySnapshot(hist.undo.pop()); }
function redo(){ if(!hist.redo.length) return; hist.undo.push(JSON.stringify(project)); applySnapshot(hist.redo.pop()); }
function updateHistBtns(){
  const u = $('#btnUndo'), r = $('#btnRedo');
  if(u) u.disabled = !hist.undo.length;
  if(r) r.disabled = !hist.redo.length;
}

/* ---------- calculations (match the way Sage totals a quote) ---------- */
const findQuote = id => project.quotes.find(q => q.id === id);
const activeQuote = () => findQuote(project.activeQuote) || project.quotes[0];
const lineNet = l => num(l.excl) * (1 - num(l.disc) / 100);
const lineTotal = l => r2(num(l.qty) * lineNet(l));
function quoteTotals(q){
  const sub = r2(q.lines.reduce((s, l) => s + lineTotal(l), 0));
  const vat = r2(sub * num(q.vatPct) / 100);
  return { sub, vat, total: r2(sub + vat) };
}
function gItemAmount(it){
  if(it.kind === 'quote'){
    if(it.override !== null && it.override !== undefined && it.override !== '') return r2(num(it.override));
    const q = findQuote(it.quoteId);
    return q ? quoteTotals(q).sub : 0;
  }
  return r2(num(it.qty) * num(it.rate));
}
function gTotals(){
  const g = project.grand;
  const sub = r2(g.items.reduce((s, it) => s + gItemAmount(it), 0));
  const vat = r2(sub * num(g.vatPct) / 100);
  const total = r2(sub + vat);
  const area = num(g.roofArea);
  return { sub, vat, total, perSqm: area > 0 ? r2(total / area) : 0 };
}
/* Sage prints the net price and the total-inclusive figure in whole shillings */
const fmtNetPrint = n => settings.sageRounding ? fmt(Math.round(n), 2) : fmt(n, 2);
const fmtTotalPrint = n => settings.sageRounding ? fmt(Math.round(n), 0) : fmt(n, 2);
const detailLines = l => splitLines(l.detail);
function paginate(q){
  const cap = Math.max(3, parseInt(q.rowsPerPage, 10) || 10);
  const pages = [[]]; let used = 0;
  q.lines.forEach(l => {
    const rows = 1 + detailLines(l).length;
    if(used > 0 && used + rows > cap){ pages.push([]); used = 0; }
    pages[pages.length - 1].push(l); used += rows;
  });
  return pages;
}

/* ---------- product library ---------- */
const sortCode = (a, b) => String(a.code).localeCompare(String(b.code), undefined, { numeric:true, sensitivity:'base' });
const findProduct = code => { const c = String(code || '').trim().toLowerCase(); return c ? library.find(x => String(x.code).trim().toLowerCase() === c) : null; };
function newProduct(over){ return Object.assign({ id:uid(), code:'', desc:'', cat:'General', unit:'pcs', price:0, disc:0, up:Date.now() }, over || {}); }
function libraryCategories(){
  const set = {}; library.forEach(x => { if(x.cat) set[x.cat] = 1; });
  return Object.keys(set).sort((a, b) => a.localeCompare(b));
}
function searchLibrary(q, limit = 12){
  const toks = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
  if(!toks.length) return [];
  const hits = [];
  library.forEach(it => {
    const hay = (it.code + ' ' + it.desc + ' ' + it.cat).toLowerCase();
    if(toks.every(t => hay.includes(t))){
      const c = String(it.code).toLowerCase(); let s = 0;
      if(c === toks[0]) s = 100; else if(c.startsWith(toks[0])) s = 50;
      hits.push([s, it]);
    }
  });
  hits.sort((a, b) => (b[0] - a[0]) || sortCode(a[1], b[1]));
  return hits.slice(0, limit).map(x => x[1]);
}
/* CSV / pasted rows:  code, description, price, category, unit, disc%  (tab or comma separated) */
function splitCsvLine(line){
  const out = []; let cur = '', q = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(q){ if(c === '"'){ if(line[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += c; }
    else if(c === '"') q = true;
    else if(c === ','){ out.push(cur); cur = ''; }
    else cur += c;
  }
  out.push(cur); return out;
}
function parseProductRows(text, defaultCat){
  const rows = [];
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    if(!raw.trim()) return;
    const cells = (raw.indexOf('\t') >= 0 ? raw.split('\t') : splitCsvLine(raw)).map(s => s.trim());
    if(/^code$/i.test(cells[0] || '')) return;   /* header row, wherever it appears */
    if(!cells[0]) return;
    rows.push({ code:cells[0], desc:cells[1] || '', price:num(cells[2]), cat:cells[3] || defaultCat || 'General', unit:cells[4] || 'pcs', disc:num(cells[5]) });
  });
  return rows;
}
function upsertProducts(rows){
  let added = 0, updated = 0;
  rows.forEach(r => {
    const ex = findProduct(r.code);
    if(ex){ ex.desc = r.desc || ex.desc; ex.price = r.price || ex.price; ex.cat = r.cat || ex.cat; ex.unit = r.unit || ex.unit; if(r.disc) ex.disc = r.disc; ex.up = Date.now(); updated++; }
    else { library.push(newProduct(r)); added++; }
  });
  saveLibrary();
  return { added, updated };
}
function libraryCsv(){
  const q = v => /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v);
  const lines = ['Code,Description,Price,Category,Unit,Disc %'];
  library.slice().sort(sortCode).forEach(x => lines.push([x.code, x.desc, x.price, x.cat, x.unit, x.disc || 0].map(q).join(',')));
  return lines.join('\r\n');
}

function A(o){ return Object.keys(o).filter(k => o[k] !== undefined && o[k] !== null).map(k => 'data-' + k + '="' + esc(o[k]) + '"').join(' '); }
function inp(o, val, cls, ph, extra){
  return '<input type="text" autocomplete="off" spellcheck="false"' + (o.num ? ' inputmode="decimal"' : '') + ' class="' + (cls || '') + '" ' + A(o) + ' value="' + esc(val == null ? '' : val) + '" placeholder="' + esc(ph || '') + '" ' + (extra || '') + '>';
}
function taInp(o, val, cls, ph){
  return '<textarea rows="1" class="autosize ' + (cls || '') + '" autocomplete="off" spellcheck="false" ' + A(o) + ' placeholder="' + esc(ph || '') + '">' + esc(val == null ? '' : val) + '</textarea>';
}
function autosize(el){ el.style.height = 'auto'; el.style.height = (el.scrollHeight + (el.offsetHeight - el.clientHeight)) + 'px'; }
function autosizeAll(){ $$('textarea.autosize').forEach(autosize); }
function F(label, o, val, opts){
  opts = opts || {};
  const type = opts.type === 'date' ? '<input type="date" autocomplete="off" ' + A(o) + ' value="' + esc(val || '') + '">' : inp(o, val, opts.cls || '', opts.ph || '', opts.extra || '');
  return '<label class="fld ' + (opts.span || '') + '"><span>' + esc(label) + '</span>' + type + '</label>';
}
function CHK(label, o, val, span){
  return '<label class="fld chk ' + (span || '') + '"><input type="checkbox" ' + A(o) + (val ? ' checked' : '') + '><span>' + esc(label) + '</span></label>';
}
function TA(label, o, val, rows, ph, span){
  return '<label class="fld ' + (span || '') + '"><span>' + esc(label) + '</span><textarea autocomplete="off" rows="' + (rows || 3) + '" ' + A(o) + ' placeholder="' + esc(ph || '') + '">' + esc(val) + '</textarea></label>';
}
function SEL(o, options, cur, extra){
  return '<select ' + A(o) + ' ' + (extra || '') + '>' + options.map(x => {
    const v = Array.isArray(x) ? x[0] : x, l = Array.isArray(x) ? x[1] : x;
    return '<option value="' + esc(v) + '"' + (String(v) === String(cur) ? ' selected' : '') + '>' + esc(l) + '</option>';
  }).join('') + '</select>';
}

  const fn = { project:tabProject, quotes:tabQuotes, grand:tabGrand, library:tabLibrary }[ui.tab];
  $('#panel').innerHTML = fn();
  refreshComputed();
  autosizeAll();
  renderModal();
  if(ui.focus){
    const el = $(ui.focus.sel);
    if(el){ el.focus(); if(ui.focus.select && el.select) el.select(); }
    ui.focus = null;
  }
}

/* ---------- live figures ---------- */
function calcVal(el){
  const d = el.dataset;
  const q = d.q ? findQuote(d.q) : null;
  switch(d.calc){
    case 'lineNet':  { const l = q && q.lines.find(x => x.id === d.l); return l ? fmt(lineNet(l)) : ''; }
    case 'lineTot':  { const l = q && q.lines.find(x => x.id === d.l); return l ? fmt(lineTotal(l)) : ''; }
    case 'qSub':     return q ? fmt(quoteTotals(q).sub) : '';
    case 'qVat':     return q ? fmt(quoteTotals(q).vat) : '';
    case 'qVatLbl':  return q ? 'VAT ' + num(q.vatPct) + '%' : '';
    case 'qTot':     return q ? fmtTotalPrint(quoteTotals(q).total) : '';
    case 'gAmt':     { const it = project.grand.items.find(x => x.id === d.i); return it ? fmt(gItemAmount(it)) : ''; }
    case 'gDiff': {
      const it = project.grand.items.find(x => x.id === d.i);
      if(!it || it.kind !== 'quote' || it.override === null || it.override === undefined || it.override === '') return '';
      const base = findQuote(it.quoteId) ? quoteTotals(findQuote(it.quoteId)).sub : 0;
      return gItemAmount(it) === base ? '' : 'quote total ' + fmt(base);
    }
    case 'gSub':     return fmt(gTotals().sub);
    case 'gVat':     return fmt(gTotals().vat);
    case 'gVatLbl':  return 'VAT ' + num(project.grand.vatPct) + '%';
    case 'gTot':     return fmt(gTotals().total);
    case 'gSqm':     { const t = gTotals(); return t.perSqm ? fmt(t.perSqm) : '—'; }
  }
  return '';
}
function refreshComputed(){
  $$('[data-calc]').forEach(el => { const v = calcVal(el); if(el.textContent !== v) el.textContent = v; });
}

function lineRow(q, l, i){
  const L = { s:'line', q:q.id, l:l.id };
  const heavy = !!l.heavy;
  const hasDetail = (l.detail || '').trim() !== '';
  const main =
    '<tr class="ln" data-l="' + l.id + '"><td class="idx">' + (i + 1) + '</td>' +
    '<td>' + inp(Object.assign({ f:'code' }, L), l.code, '', 'Code') + '</td>' +
    '<td>' + taInp(Object.assign({ f:'desc' }, L), l.desc, '', 'Description') + '</td>' +
    '<td>' + inp(Object.assign({ f:'qty', num:1 }, L), numDisp(l.qty), 'r', '0', heavy ? 'readonly title="Calculated by the heavy gauge calculator — click ✎ to change"' : '') + '</td>' +
    '<td>' + inp(Object.assign({ f:'excl', num:1 }, L), numDisp(l.excl), 'r', '0.00') + '</td>' +
    '<td>' + inp(Object.assign({ f:'disc', num:1 }, L), numDisp(l.disc), 'r', '0') + '</td>' +
    '<td class="r"><span class="calc soft" data-calc="lineNet" data-q="' + q.id + '" data-l="' + l.id + '"></span></td>' +
    '<td class="r"><span class="calc" data-calc="lineTot" data-q="' + q.id + '" data-l="' + l.id + '"></span></td>' +
    '<td class="acts">' +
      '<button class="ib" data-action="move-line" data-q="' + q.id + '" data-l="' + l.id + '" data-dir="-1" title="Move up"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
      '<button class="ib" data-action="move-line" data-q="' + q.id + '" data-l="' + l.id + '" data-dir="1" title="Move down"' + (i === q.lines.length - 1 ? ' disabled' : '') + '>↓</button>' +
      '<button class="ib" data-action="dup-line" data-q="' + q.id + '" data-l="' + l.id + '" title="Duplicate line">⧉</button>' +
      '<button class="ib ' + (l.detailOpen || hasDetail ? 'on' : '') + '" data-action="toggle-detail" data-q="' + q.id + '" data-l="' + l.id + '" title="Extra lines printed in blue under this item">¶</button>' +
      (heavy ? '<button class="ib" data-action="edit-heavy" data-q="' + q.id + '" data-l="' + l.id + '" title="Edit heavy gauge calculation">✎</button>' : '') +
      '<button class="ib" data-action="save-lib-line" data-q="' + q.id + '" data-l="' + l.id + '" title="Save this product to the library (or update its price)">Lib</button>' +
      '<button class="ib del" data-action="del-line" data-q="' + q.id + '" data-l="' + l.id + '" title="Delete line">✕</button>' +
    '</td></tr>';
  const detail = l.detailOpen
    ? '<tr class="dt"><td></td><td colspan="8"><textarea rows="2" class="autosize multi" autocomplete="off" ' + A(Object.assign({ f:'detail' }, L)) + ' placeholder="Extra lines printed in blue under this item — one per line (e.g. Total Length - 1340m)">' + esc(l.detail) + '</textarea></td></tr>'
    : '';
  return main + detail;
}

  const toks = ui.libQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);

      '<td>' + inp(Object.assign({ f:'unit' }, P), it.unit, '', 'pcs') + '</td>' +

      '<button class="ib del" data-action="lib-del" data-i="' + it.id + '" title="Delete product">✕</button></td></tr>';

  return '<div class="tablewrap"><table class="lib"><colgroup><col style="width:150px"><col><col style="width:210px"><col style="width:70px"><col style="width:110px"><col style="width:70px"><col style="width:230px"></colgroup>' +

/* ---------- Heavy gauge steel ---------- */
const HEAVY_NO_THICK = { 'UB':1, 'UC':1, 'IPE':1, 'Flats':1, 'R BArs':1, 'plates':1 };
const hKey = (cat, it) => cat + '|' + it.size + '|' + (it.t == null ? '' : it.t);
function hRate(cat, it){ const k = hKey(cat, it); if(heavyRates[k] != null) return heavyRates[k]; return it.rateKg != null ? it.rateKg : 0; }
function hSpec(cat, it){
  if(cat === 'UB' || cat === 'UC' || cat === 'IPE' || cat === 'plates') return it.size;
  return HEAVY[cat].label + ' ' + it.size + (it.t != null && !HEAVY_NO_THICK[cat] ? ' x ' + it.t + 'mm' : '') + (it['class'] ? ' class ' + it['class'] : '');
}
function tabHeavy(){
  const cats = Object.keys(HEAVY);
  const chips = '<div class="chips">' + cats.map(c => '<button class="chip ' + (ui.heavyCat === c ? 'on' : '') + '" data-action="heavy-cat" data-c="' + esc(c) + '">' + esc(HEAVY[c].label) + '</button>').join('') + '</div>';
  return '<section class="card"><h2>Heavy gauge steel sections</h2><p class="sub">The steel section library from the Ropa quote tool. Rates per kg are editable and saved on this computer; a section becomes a quote line with its weight worked out from number × length × kg/m.</p>' +
    chips + '<div class="lib-tools"><input id="heavyQ" type="text" autocomplete="off" placeholder="Filter this section list…" value="' + esc(ui.heavyQuery) + '"></div>' +
    '<div id="heavyList">' + heavyListHTML() + '</div></section>';
}
function heavyListHTML(){
  const cat = HEAVY[ui.heavyCat] ? ui.heavyCat : Object.keys(HEAVY)[0];
  const toks = ui.heavyQuery.trim().toLowerCase().split(/\s+/).filter(Boolean);
  const rows = [];
  HEAVY[cat].items.forEach((it, idx) => {
    const spec = hSpec(cat, it);
    if(toks.length && !toks.every(t => spec.toLowerCase().includes(t))) return;
    const perPc = it.kgPerPc != null;
    rows.push('<tr><td class="plain"><b>' + esc(spec) + '</b></td>' +
      '<td class="plain r">' + (perPc ? fmt(it.kgPerPc, 3) + ' kg / pc' : fmt(it.kgPerM, 3) + ' kg/m') + '</td>' +
      '<td>' + inp({ s:'heavyrate', k:hKey(cat, it), num:1 }, numDisp(hRate(cat, it)), 'r', 'rate / kg') + '</td>' +
      '<td class="acts"><button class="ib" data-action="heavy-add" data-c="' + esc(cat) + '" data-idx="' + idx + '">+ Add to quote</button></td></tr>');
  });
  if(!rows.length) return '<div class="empty">No sections match.</div>';
  return '<div class="tablewrap"><table class="lib"><colgroup><col><col style="width:160px"><col style="width:140px"><col style="width:160px"></colgroup><thead><tr><th>Section</th><th class="r">Mass</th><th class="r">Rate / kg (KSh)</th><th></th></tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
}
function heavyResult(m){
  const nos = num(m.nos), rate = num(m.rate);
  let kg = 0, kgm = 0, lenTot = 0, code = '', desc = '', detail = '';
  if(m.cat === '__plate'){
    const t = num(m.pt), w = num(m.pw), l = num(m.pl);
    kg = nos * l * w * t * 7850 / 1e9;
    code = 'PL' + t; desc = 'Steel plate ' + t + 'mm';
    detail = nos + ' nos × ' + l + ' × ' + w + ' × ' + t + ' mm plate = ' + fmt(kg, 2) + ' kg (7850 kg/m³)';
  } else if(m.cat === '__kgm'){
    kgm = num(m.kgm); lenTot = nos * num(m.len); kg = lenTot * kgm;
    code = m.name || 'STEEL'; desc = 'Structural steel — ' + (m.name || 'section');
    detail = nos + ' nos × ' + fmt(num(m.len), 2) + ' m = ' + fmt(lenTot, 2) + ' m @ ' + kgm + ' kg/m';
  } else {
    const it = HEAVY[m.cat].items[m.idx]; if(!it) return { kg:0, kgm:0, lenTot:0, amount:0, code:'', desc:'', detail:'' };
    const spec = hSpec(m.cat, it);
    code = spec;
    if(it.kgPerPc != null){
      kg = nos * it.kgPerPc; desc = 'Steel ' + spec; detail = nos + ' pcs × ' + fmt(it.kgPerPc, 3) + ' kg = ' + fmt(kg, 2) + ' kg';
    } else {
      kgm = it.kgPerM; lenTot = nos * num(m.len); kg = lenTot * kgm;
      desc = 'Structural steel — ' + spec;
      detail = nos + ' nos × ' + fmt(num(m.len), 2) + ' m = ' + fmt(lenTot, 2) + ' m @ ' + kgm + ' kg/m';
    }
  }
  kg = Math.round(kg * 1000) / 1000;
  return { kg, kgm, lenTot, amount: r2(kg * rate), code, desc, detail };
}

/* A long grand summary is shrunk just enough to stay on one A4 page */
function fitGrandPages(){
  $$('#printRoot .gpage').forEach(pg => {
    const t = $('table.gs', pg); if(!t) return;
    t.style.zoom = '';
    const cs = getComputedStyle(pg);
    const avail = 296 * 96 / 25.4 - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;
    const h = t.getBoundingClientRect().height;
    if(h > avail) t.style.zoom = Math.max(0.55, avail / h).toFixed(3);
  });
}

/* =====================================================================
   Supabase sync — shared product library + shared projects
   Kept deliberately light on data transfer:
     · the project list never downloads the quote bodies, only names
     · the library only asks for rows changed since the last sync
   ===================================================================== */
const cloud = { busy:false, projects:null, listedAt:0, err:'' };

const cloudOn = () => !!(settings.cloud && settings.cloud.enabled && settings.cloud.url && settings.cloud.key);
function cloudBase(){
  let u = String((settings.cloud && settings.cloud.url) || '').trim().replace(/\/+$/, '');
  if(u && !/^https?:\/\//i.test(u)) u = 'https://' + u;
  /* a bare project ref is enough */
  if(u && !/\./.test(u.replace(/^https?:\/\//i, ''))) u = 'https://' + u.replace(/^https?:\/\//i, '') + '.supabase.co';
  return u;
}
function cloudHeaders(extra){
  const k = String((settings.cloud && settings.cloud.key) || '').trim();
  return Object.assign({ apikey:k, Authorization:'Bearer ' + k, 'Content-Type':'application/json' }, extra || {});
}
async function cloudReq(path, opts){
  opts = opts || {};
  const res = await fetch(cloudBase() + '/rest/v1/' + path, {
    method: opts.method || 'GET',
    headers: cloudHeaders(opts.headers),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if(!res.ok){
    let msg = res.status + ' ' + res.statusText;
    try{ const j = await res.json(); if(j && (j.message || j.hint)) msg = j.message || j.hint; }catch(e){}
    if(res.status === 401 || res.status === 403) msg = 'Supabase refused the request (' + res.status + '). Check the key and the table policies.';
    if(res.status === 404) msg = 'Table not found — run the setup SQL in Supabase first.';
    throw new Error(msg);
  }
  if(res.status === 204) return null;
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}
const isoNow = () => new Date().toISOString();
function cloudFail(e){
  const m = (e && e.message) ? e.message : String(e);
  cloud.err = m;
  toast(/Failed to fetch|NetworkError|Load failed/i.test(m) ? 'No connection to Supabase — check the internet and the project URL' : m);
}

/* ---------- product library ---------- */
const prodRow = p => ({ code:String(p.code || '').trim(), descr:p.desc || '', cat:p.cat || 'General', unit:p.unit || 'pcs', price:num(p.price), disc:num(p.disc), deleted:false, updated_at:new Date(p.up || Date.now()).toISOString() });
function applyRemoteProduct(r){
  const remoteUp = Date.parse(r.updated_at) || 0;
  const local = findProduct(r.code);
  if(r.deleted){
    if(local && (local.up || 0) <= remoteUp) library = library.filter(x => x !== local);
    return;
  }
  if(!local){ library.push(newProduct({ code:r.code, desc:r.descr || '', cat:r.cat || 'General', unit:r.unit || 'pcs', price:num(r.price), disc:num(r.disc), up:remoteUp })); return; }
  if((local.up || 0) < remoteUp){ local.desc = r.descr || ''; local.cat = r.cat || 'General'; local.unit = r.unit || 'pcs'; local.price = num(r.price); local.disc = num(r.disc); local.up = remoteUp; }
}
async function syncLibrary(silent){
  if(!cloudOn() || cloud.busy) return false;
  cloud.busy = true; cloud.err = '';
  const since = settings.cloud.libSyncedAt || '';
  try{
    /* 1. take everything changed on the server since last time */
    const q = 'ss_products?select=code,descr,cat,unit,price,disc,deleted,updated_at' + (since ? '&updated_at=gt.' + encodeURIComponent(since) : '');
    const rows = await cloudReq(q);
    (rows || []).forEach(applyRemoteProduct);
    /* 2. send up anything edited here since last time */
    const cut = Date.parse(since) || 0;
    const mine = library.filter(p => String(p.code || '').trim() && (p.up || 0) > cut).map(prodRow);
    if(mine.length) await cloudReq('ss_products', { method:'POST', body:mine, headers:{ Prefer:'resolution=merge-duplicates' } });
    const tombs = (lsGet(LS.tombs, []) || []);
    if(tombs.length){
      await cloudReq('ss_products', { method:'POST', body:tombs.map(t => ({ code:t.code, descr:'', deleted:true, updated_at:new Date(t.up).toISOString() })), headers:{ Prefer:'resolution=merge-duplicates' } });
      lsSet(LS.tombs, []);
    }
    settings.cloud.libSyncedAt = isoNow(); saveSettings(); saveLibrary();
    if(!silent) toast('Library synced — ' + library.length + ' products');
    return true;
  }catch(e){ cloudFail(e); return false; }
  finally{ cloud.busy = false; }
}

/* ---------- projects ---------- */
async function cloudListProjects(){
  if(!cloudOn()) return null;
  cloud.err = '';
  try{
    /* names only — the quote bodies stay on the server until a project is opened */
    cloud.projects = await cloudReq('ss_projects?select=id,name,client,updated_at&order=updated_at.desc&limit=200') || [];
    cloud.listedAt = Date.now();
    return cloud.projects;
  }catch(e){ cloudFail(e); cloud.projects = []; return null; }
}
async function cloudPushProject(p){
  if(!cloudOn()){ toast('Turn on Supabase sync in Settings first'); return false; }
  if(cloud.busy) return false;
  cloud.busy = true;
  try{
    saveNow();
    const body = [{ id:p.id, name:projectLabel(p), client:(p.client && p.client.name) || '', updated_at:isoNow(), data:p }];
    await cloudReq('ss_projects', { method:'POST', body, headers:{ Prefer:'resolution=merge-duplicates' } });
    toast('“' + projectLabel(p) + '” saved to the cloud');
    if(cloud.projects) await cloudListProjects();
    return true;
  }catch(e){ cloudFail(e); return false; }
  finally{ cloud.busy = false; }
}
async function cloudOpenProject(id){
  if(!cloudOn()) return false;
  cloud.busy = true;
  try{
    const rows = await cloudReq('ss_projects?select=data&id=eq.' + encodeURIComponent(id) + '&limit=1');
    const raw = rows && rows[0] && rows[0].data;
    if(!raw){ toast('That project is no longer in the cloud'); return false; }
    const local = lsGet(LS.proj(id), null);
    if(local && (local.updated || 0) > (Date.parse(raw.updated ? new Date(raw.updated).toISOString() : 0) || raw.updated || 0)){
      if(!confirm('Your copy of “' + projectLabel(local) + '” on this computer is newer than the cloud copy.\n\nOpen the cloud copy anyway and replace the local one?')) return false;
    }
    if(project) saveNow();
    project = normalizeProject(raw); project.sample = false;
    histInit(); saveNow();
    ui.modal = null; ui.tab = 'quotes'; render();
    toast('Opened “' + projectLabel(project) + '” from the cloud');
    return true;
  }catch(e){ cloudFail(e); return false; }
  finally{ cloud.busy = false; }
}
async function cloudDeleteProject(id){
  if(!cloudOn()) return false;
  try{
    await cloudReq('ss_projects?id=eq.' + encodeURIComponent(id), { method:'DELETE' });
    await cloudListProjects(); renderModal(); toast('Removed from the cloud (your local copy is untouched)');
    return true;
  }catch(e){ cloudFail(e); return false; }
}

  if(!cloudBase() || !String(settings.cloud.key || '').trim()){ toast('Enter the project URL and the publishable key first'); return; }

function touch(structural){ histRecord(structural); queueSave(); refreshComputed(); renderTopbar(); if(ui.preview) schedulePreview(); }

const lineOf = (qid, lid) => { const q = findQuote(qid); return q ? q.lines.find(l => l.id === lid) : null; };

/* ---------- writing a field into state (no re-render) ---------- */
function resolveTarget(d){
  switch(d.s){
    case 'proj':   return project;
    case 'client': return project.client;
    case 'quote':  return findQuote(d.q);
    case 'line':   return lineOf(d.q, d.l);
    case 'grand':  return project.grand;
    case 'gitem':  return project.grand.items.find(x => x.id === d.i);
    case 'lib':    return library.find(x => x.id === d.i);
  }
  return null;
}
function applyField(el){
  const d = el.dataset;
  if(!d.s) return;
  if(d.s === 'modal'){ modalSet(d.f, el); return; }
  if(d.s === 'heavyrate'){
    const v = String(el.value).trim();
    if(v === '') delete heavyRates[d.k]; else heavyRates[d.k] = num(v);
    lsSet(LS.heavy, heavyRates); return;
  }
  let v;
  if(el.type === 'checkbox') v = el.checked;
  else if(d.lines) v = splitLines(el.value);
  else if(d.num) v = num(el.value);
  else v = el.value;
  if(d.s === 'set'){ setPath(settings, d.f, v); touchSettings(); return; }
  const t = resolveTarget(d);
  if(!t) return;
  if(d.s === 'gitem' && d.f === 'override'){ t.override = String(el.value).trim() === '' ? null : num(el.value); touch(); return; }
  t[d.f] = v;
  if(d.s === 'lib') touchLibrary(t); else touch(el.tagName === 'SELECT' || el.type === 'checkbox');
}
function modalSet(f, el){
  const m = ui.modal; if(!m) return;
  const val = el.type === 'checkbox' ? el.checked : (el.dataset.num ? num(el.value) : el.value);
  if(m.type === 'heavy'){
    if(f === 'cat'){
      m.cat = val; m.idx = 0;
      if(val !== '__plate' && val !== '__kgm') m.rate = hRate(val, HEAVY[val].items[0]);
    } else if(f === 'idx'){
      m.idx = parseInt(val, 10) || 0; m.rate = hRate(m.cat, HEAVY[m.cat].items[m.idx]);
    } else m[f] = val;
    if(el.dataset.rr) renderModal(); else refreshModalCalc();
  } else m[f] = val;
}

function moveIn(arr, i, dir){ const j = i + dir; if(j < 0 || j >= arr.length) return; const t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
function moveG(id, dir){
  const items = project.grand.items;
  const i = items.findIndex(x => x.id === id); if(i < 0) return;
  const grp = items[i].group; let j = i + dir;
  while(j >= 0 && j < items.length && items[j].group !== grp) j += dir;
  if(j < 0 || j >= items.length) return;
  const t = items[i]; items[i] = items[j]; items[j] = t;
}

/* ---------- click actions ---------- */
function act(a, el, ev){
  const d = el.dataset;
  switch(a){
    case 'tab': ui.tab = d.tab; render(); window.scrollTo(0, 0); break;
    case 'undo': undo(); break;
    case 'redo': redo(); break;
    case 'settings': ui.modal = { type:'settings' }; ui.showSql = false; renderModal(); break;
    case 'projects': ui.modal = { type:'projects' }; renderModal(); if(cloudOn()) cloudListProjects().then(() => { if(ui.modal && ui.modal.type === 'projects') renderModal(); }); break;
    case 'modal-close': closeModal(); break;
    case 'modal-bg': if(ev.target === el) closeModal(); break;
    case 'settings-reset':
      if(confirm('Restore the company block, terms and print options to the Space & Style defaults?\n\nYour Supabase connection is kept.')){ const keepCloud = clone(settings.cloud); settings = clone(DEFAULT_SETTINGS); settings.cloud = keepCloud; saveSettings(); renderModal(); }
      break;
    case 'preview': enterPreview(d.set); break;
    case 'preview-exit': exitPreview(); break;
    case 'print': renderPrintRoot(); window.print(); break;
    case 'new-project': startNewProject(); break;
    case 'export-json': exportProject(); break;
    case 'import-json': importProject(); break;
    case 'proj-open': if(loadProjectById(d.id)){ ui.modal = null; ui.tab = 'quotes'; render(); } break;
    case 'proj-dup': duplicateProject(d.id); break;
    case 'proj-del': {
      if(!confirm('Delete this project from this computer? Export it first if you may need it again.')) break;
      const wasCurrent = d.id === project.id;
      deleteProjectById(d.id);
      if(wasCurrent){
        clearTimeout(saveTimer); saveTimer = null; project = null;   /* so loading the next one cannot re-save the deleted one */
        const next = readIndex()[0];
        if(next && loadProjectById(next.id)){ ui.tab = 'quotes'; }
        else { project = blankProject(); histInit(); saveNow(); ui.tab = 'project'; }
        render();
      } else renderModal();
      break;
    }

    /* quotations */
    case 'pick-quote': project.activeQuote = d.q; queueSave(); ui.search = { q:'', res:[], idx:0 }; render(); break;
    case 'add-quote': { const q = newQuote(project); project.quotes.push(q); project.activeQuote = q.id; touch(true); render(); break; }
    case 'dup-quote': {
      const src = activeQuote(); const c = clone(src);
      c.id = uid(); c.title = (src.title || 'Quote') + ' (copy)'; c.no = autoQuoteNo(project); c.lines.forEach(l => { l.id = uid(); });
      project.quotes.splice(project.quotes.indexOf(src) + 1, 0, c); project.activeQuote = c.id; touch(true); render(); break;
    }
    case 'del-quote': {
      if(project.quotes.length < 2){ toast('A project needs at least one quote — clear its lines instead'); break; }
      const q = activeQuote();
      const linked = project.grand.items.filter(it => it.kind === 'quote' && it.quoteId === q.id);
      if(!confirm('Delete "' + (q.title || 'this quote') + '" and all its lines?' + (linked.length ? '\n\n' + linked.length + ' grand summary line(s) use this quote. They will stay as typed-in amounts at their current figure, so the grand total does not change.' : ''))) break;
      linked.forEach(it => { const amt = gItemAmount(it); it.kind = 'manual'; it.quoteId = ''; it.override = null; it.qty = 1; it.rate = amt; });
      project.quotes = project.quotes.filter(x => x.id !== q.id);
      project.activeQuote = project.quotes[0].id;
      touch(true); render(); break;
    }
    case 'add-line': { addLineTo(activeQuote(), {}, 'code'); render(); break; }
    case 'del-line': { const q = findQuote(d.q); if(!q) break; q.lines = q.lines.filter(l => l.id !== d.l); touch(true); render(); break; }
    case 'dup-line': {
      const q = findQuote(d.q); if(!q) break; const i = q.lines.findIndex(l => l.id === d.l); if(i < 0) break;
      const c = clone(q.lines[i]); c.id = uid(); q.lines.splice(i + 1, 0, c); touch(true); render(); break;
    }
    case 'move-line': { const q = findQuote(d.q); if(!q) break; moveIn(q.lines, q.lines.findIndex(l => l.id === d.l), parseInt(d.dir, 10)); touch(true); render(); break; }
    case 'toggle-detail': {
      const l = lineOf(d.q, d.l); if(!l) break;
      l.detailOpen = !(l.detailOpen); touch(true);
      if(l.detailOpen) ui.focus = { sel:'tr.dt [data-l="' + l.id + '"]' };
      render(); break;
    }
    case 'save-lib-line': { const l = lineOf(d.q, d.l); if(l) saveLineToLibrary(l); break; }
    case 'lib-pick': pickSearch(d.i); break;

    /* heavy gauge */
    case 'open-heavy': ui.modal = heavyDefaults({ qid:activeQuote().id }); renderModal(); break;
    case 'edit-heavy': {
      const l = lineOf(d.q, d.l); if(!l || !l.heavy) break;
      ui.modal = heavyDefaults(Object.assign({}, l.heavy, { mode:'edit', lineId:l.id, qid:d.q })); renderModal(); break;
    }
    case 'heavy-add': ui.modal = heavyDefaults({ qid:activeQuote().id, cat:d.c, idx:parseInt(d.idx, 10), rate:hRate(d.c, HEAVY[d.c].items[parseInt(d.idx, 10)]) }); renderModal(); break;
    case 'heavy-ok': heavyOk(); break;
    case 'heavy-cat': ui.heavyCat = d.c; ui.heavyQuery = ''; render(); break;

    /* grand summary */
    case 'g-del': project.grand.items = project.grand.items.filter(x => x.id !== d.i); touch(true); render(); break;
    case 'g-move': moveG(d.i, parseInt(d.dir, 10)); touch(true); render(); break;
    case 'g-std-prelims': {
      let added = 0;
      STD_PRELIMS.forEach(t => { if(!project.grand.items.some(x => x.label === t)){ project.grand.items.push(newGItem('prelim', t)); added++; } });
      if(added){ touch(true); render(); } else toast('The standard preliminaries are already there');
      break;
    }

    /* library */
    case 'lib-tab': ui.libTab = d.t; render(); break;
    case 'lib-add': { const p = newProduct(); library.push(p); saveLibrary(); ui.libQuery = ''; ui.libCat = ''; ui.focus = { sel:'#libList [data-i="' + p.id + '"][data-f="code"]' }; render(); break; }
    case 'lib-del': {
      const p = library.find(x => x.id === d.i); if(!p) break;
      if(!confirm('Delete ' + (p.code || 'this product') + ' from the library?')) break;
      library = library.filter(x => x.id !== d.i); saveLibrary();
      if(String(p.code || '').trim()){ const tb = lsGet(LS.tombs, []) || []; tb.push({ code:p.code.trim(), up:Date.now() }); lsSet(LS.tombs, tb); }
      $('#libList').innerHTML = libListHTML(); break;
    }
    case 'lib-to-quote': { const p = library.find(x => x.id === d.i); if(p) addProductToQuote(activeQuote(), p, false); break; }
    case 'lib-variant': { const p = library.find(x => x.id === d.i); if(p){ ui.modal = { type:'variant', srcId:p.id, code:'', desc:p.desc }; renderModal(); const c = $('#modalRoot [data-f="code"]'); if(c) c.focus(); } break; }
    case 'variant-ok': {
      const m = ui.modal, src = library.find(x => x.id === m.srcId);
      const code = String(m.code || '').trim();
      if(!code){ toast('Enter the new product code'); break; }
      if(findProduct(code)){ toast(code + ' is already in the library'); break; }
      library.push(newProduct({ code, desc:m.desc, cat:src.cat, unit:src.unit, price:src.price, disc:src.disc }));
      saveLibrary(); ui.modal = null; render(); toast('Created ' + code); break;
    }
    case 'cloud-test': cloudTest(); break;
    case 'cloud-sql': ui.showSql = !ui.showSql; renderModal(); break;
    case 'cloud-list': cloudListProjects().then(renderModal); break;
    case 'cloud-push': cloudPushProject(project).then(renderModal); break;
    case 'cloud-open': cloudOpenProject(d.id); break;
    case 'cloud-del':
      if(confirm('Remove this project from the shared cloud list? Local copies on each computer stay.')) cloudDeleteProject(d.id);
      break;
    case 'lib-sync': syncLibrary().then(ok => { if(ok) render(); }); break;
    case 'lib-bulk': ui.modal = { type:'bulk', cat:ui.libCat || '', text:'' }; renderModal(); break;
    case 'bulk-ok': {
      const rows = parseProductRows(ui.modal.text, ui.modal.cat);
      if(!rows.length){ toast('Nothing to add — paste rows with at least a code'); break; }
      const r = upsertProducts(rows); ui.modal = null; render(); toast(r.added + ' added, ' + r.updated + ' updated'); break;
    }
    case 'lib-export': downloadBlob(new Blob([libraryCsv()], { type:'text/csv' }), 'space-and-style-product-library.csv'); break;
    case 'lib-import': pickFile('.csv,.txt,text/csv', text => {
      const rows = parseProductRows(text, ''); if(!rows.length){ toast('No products found in that file'); return; }
      const r = upsertProducts(rows); ui.modal = null; render(); toast(r.added + ' added, ' + r.updated + ' updated');
    }); break;
  }
}

/* ---------- listeners ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if(!e.target.closest('.libsearch')) hideSearch();
  if(el) act(el.dataset.action, el, e);
});
document.addEventListener('input', e => {
  const t = e.target;
  if(t.id === 'libSearch'){
    ui.search.q = t.value; ui.search.res = searchLibrary(t.value); ui.search.idx = 0; drawSearch(); return;
  }
  if(t.id === 'libQ'){ ui.libQuery = t.value; const l = $('#libList'); if(l) l.innerHTML = libListHTML(); return; }
  if(t.id === 'heavyQ'){ ui.heavyQuery = t.value; const l = $('#heavyList'); if(l) l.innerHTML = heavyListHTML(); return; }
  if(t.classList && t.classList.contains('autosize')) autosize(t);
  if(t.dataset && t.dataset.s && ((t.tagName === 'INPUT' && t.type !== 'checkbox') || t.tagName === 'TEXTAREA')) applyField(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset && t.dataset.onchange){
    const v = t.value;
    if(t.dataset.onchange === 'gadd'){
      if(!v) return;
      let it = null;
      if(v.indexOf('q:') === 0){ const q = findQuote(v.slice(2)); if(q) it = newGItem('main', q.title || 'Quotation', { kind:'quote', quoteId:q.id }); }
      else { const p = G_PRESETS.find(x => x.k === v.slice(2)); if(p) it = newGItem(p.group, p.text, { kind:'manual', qty:1, rate:0 }); }
      if(it){ project.grand.items.push(it); touch(true); ui.focus = { sel:'[data-i="' + it.id + '"][data-f="label"]' }; render(); }
      return;
    }
    if(t.dataset.onchange === 'libcat'){ ui.libCat = v; const l = $('#libList'); if(l) l.innerHTML = libListHTML(); return; }
    if(t.dataset.onchange === 'pvset'){ ui.printSet = v; renderPrintRoot(); return; }
  }
  if(!t.dataset || !t.dataset.s) return;
  if(t.tagName === 'SELECT' || (t.tagName === 'INPUT' && t.type === 'checkbox')){
    applyField(t);
    if(t.dataset.rr && t.dataset.s !== 'modal') render();
    return;
  }
  if(t.tagName === 'INPUT' && t.dataset.s === 'line' && t.dataset.f === 'code') autofillLine(t);
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if(t && t.classList && t.classList.contains('autosize') && !t.classList.contains('multi') && e.key === 'Enter'){ e.preventDefault(); return; }
  if(t && t.id === 'libSearch'){
    const s = ui.search; const n = Math.max(s.res.length, 1);
    if(e.key === 'ArrowDown'){ e.preventDefault(); s.idx = (s.idx + 1) % n; drawSearch(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); s.idx = (s.idx - 1 + n) % n; drawSearch(); }
    else if(e.key === 'Enter'){
      e.preventDefault();
      if(s.res.length) pickSearch(s.res[s.idx].id); else if(s.q.trim()) pickSearch('__custom');
    } else if(e.key === 'Escape'){ hideSearch(); }
    return;
  }
  if(e.key === 'Escape'){
    if(ui.modal){ closeModal(); return; }
    if(ui.preview){ exitPreview(); return; }
  }
  const typing = t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
  if((e.ctrlKey || e.metaKey) && !typing){
    const k = e.key.toLowerCase();
    if(k === 'z' && !e.shiftKey){ e.preventDefault(); undo(); }
    else if(k === 'y' || (k === 'z' && e.shiftKey)){ e.preventDefault(); redo(); }
  }
});
window.addEventListener('beforeprint', () => { if(!ui.preview) ui.printSet = defaultSet(); renderPrintRoot(); });
window.addEventListener('afterprint', () => { if(!ui.preview){ const r = $('#printRoot'); if(r) r.innerHTML = ''; } });
window.addEventListener('resize', () => { if(!ui.preview) autosizeAll(); });
window.addEventListener('beforeunload', () => { if(saveTimer) saveNow(); });

/* ---------- startup ---------- */
function init(){
  $('#brandLogo').src = ASSETS.logo;
  settings = mergeSettings(lsGet(LS.settings, null));
  let lib = lsGet(LS.library, null);
  if(!Array.isArray(lib)){ lib = LIB_SEED.map(r => newProduct({ code:r[0], desc:r[1], cat:r[2], unit:r[3], price:r[4] })); library = lib; saveLibrary(); }
  library = lib;
  heavyRates = lsGet(LS.heavy, {}) || {};
  project = null;
  let ok = false;
  const cur = lsGet(LS.cur, null);
  if(cur) ok = loadProjectById(cur);
  if(!ok){ for(const e of readIndex()){ if(loadProjectById(e.id)){ ok = true; break; } } }
  if(!ok){
    project = lsGet(LS.seeded, false) ? blankProject() : sampleProject();
    lsSet(LS.seeded, true); histInit(); saveNow();
  }
  ui.tab = 'quotes';
  render();
  if(cloudOn()) syncLibrary(true).then(ok => { if(ok && ui.tab === 'library') render(); });
}
init();

</script>
